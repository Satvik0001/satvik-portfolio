<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Stadium Arena Sky Gradient -->
    <linearGradient id="stadiumSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <!-- Muddy Water Hazard Pit Gradient -->
    <linearGradient id="hazardWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#713f12" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#1c0a02" />
    </linearGradient>

    <!-- Rotating Spiked Log Wood Gradient -->
    <linearGradient id="spikedLog" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Stadium Floodlight Glow -->
    <radialGradient id="lightBeam" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#7c3aed" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Arena Sky -->
  <rect width="800" height="450" fill="url(#stadiumSky)" />

  <!-- Stadium Floodlights (Top Left & Top Right) -->
  <polygon points="120,20 0,420 320,420" fill="url(#lightBeam)" />
  <polygon points="680,20 480,420 800,420" fill="url(#lightBeam)" />

  <!-- Hazard Mud & Water Pit at the Bottom -->
  <rect x="0" y="360" width="800" height="90" fill="url(#hazardWater)" />
  <!-- Water ripples -->
  <path d="M 0,364 Q 100,368 200,364 T 400,364 T 600,364 T 800,364" fill="none" stroke="#a16207" stroke-width="2" opacity="0.6" />
  <path d="M 0,378 Q 100,382 200,378 T 400,378 T 600,378 T 800,378" fill="none" stroke="#ca8a04" stroke-width="1.5" opacity="0.4" />

  <!-- Background Takeshi's Castle Japanese Gate & Ramparts -->
  <g fill="#450a0a" stroke="#7f1d1d" stroke-width="2" opacity="0.65">
    <rect x="320" y="70" width="160" height="110" />
    <!-- Curved Castle Pagoda Roof -->
    <path d="M 280,75 Q 400,35 520,75 L 500,60 Q 400,25 300,60 Z" fill="#991b1b" />
    <path d="M 320,30 Q 400,5 480,30 L 470,18 Q 400,0 330,18 Z" fill="#991b1b" />
  </g>

  <!-- OBSTACLE 1: Rotating Giant Cylindrical Rolling Log -->
  <g transform="translate(180, 290)">
    <!-- Main Log Cylinder -->
    <rect x="-120" y="-18" width="240" height="36" rx="18" fill="url(#spikedLog)" stroke="#d97706" stroke-width="2" />
    <!-- Yellow Caution Warning Stripes -->
    <path d="M -100,-18 L -80,18 M -50,-18 L -30,18 M 0,-18 L 20,18 M 50,-18 L 70,18 M 100,-18 L 120,18" stroke="#18181b" stroke-width="6" opacity="0.5" />
    <!-- Rubber Spikes around the log -->
    <polygon points="-80,-18 -75,-32 -70,-18" fill="#18181b" />
    <polygon points="-30,-18 -25,-32 -20,-18" fill="#18181b" />
    <polygon points="20,-18 25,-32 30,-18" fill="#18181b" />
    <polygon points="70,-18 75,-32 80,-18" fill="#18181b" />
    <polygon points="-55,18 -50,32 -45,18" fill="#18181b" />
    <polygon points="-5,18 0,32 5,18" fill="#18181b" />
    <polygon points="45,18 50,32 55,18" fill="#18181b" />
    <!-- Curved Motion Arrow around Log -->
    <path d="M -6,45 Q 35,42 42,20" fill="none" stroke="#facc15" stroke-width="3" marker-end="url(#arrow)" />
  </g>

  <!-- OBSTACLE 2: Giant Swinging Wrecking Ball Pendulum -->
  <g transform="translate(490, 80)">
    <!-- Heavy Chain -->
    <line x1="0" y1="0" x2="-45" y2="150" stroke="#94a3b8" stroke-width="4" stroke-dasharray="4,4" />
    <!-- Spiked Red Wrecking Ball -->
    <circle cx="-45" cy="150" r="28" fill="#dc2626" stroke="#b91c1c" stroke-width="3" />
    <!-- Spikes on Ball -->
    <polygon points="-45,120 -50,110 -40,110" fill="#facc15" />
    <polygon points="-45,180 -50,190 -40,190" fill="#facc15" />
    <polygon points="-75,150 -85,145 -85,155" fill="#facc15" />
    <polygon points="-15,150 -5,145 -5,155" fill="#facc15" />
    <!-- Motion blur arc -->
    <path d="M -120,130 Q -45,190 30,130" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4" opacity="0.6" />
  </g>

  <!-- OBSTACLE 3: Slippery Stepping Stones in the Mud -->
  <ellipse cx="360" cy="330" rx="35" ry="16" fill="#475569" stroke="#94a3b8" stroke-width="2" />
  <ellipse cx="440" cy="310" rx="30" ry="14" fill="#475569" stroke="#94a3b8" stroke-width="2" />
  <ellipse cx="530" cy="325" rx="34" ry="15" fill="#475569" stroke="#94a3b8" stroke-width="2" />

  <!-- FINISH LINE PLATFORM (Far Right) with Golden Victory Bell -->
  <g transform="translate(680, 240)">
    <!-- Solid Victory Stage -->
    <polygon points="0,40 120,40 100,140 -20,140" fill="#065f46" stroke="#10b981" stroke-width="3" />
    <!-- Checkerboard Finish Line Strip -->
    <rect x="-10" y="38" width="120" height="12" fill="#ffffff" />
    <rect x="-10" y="38" width="15" height="12" fill="#000000" />
    <rect x="20" y="38" width="15" height="12" fill="#000000" />
    <rect x="50" y="38" width="15" height="12" fill="#000000" />
    <rect x="80" y="38" width="15" height="12" fill="#000000" />
    <!-- Golden Gong / Bell -->
    <rect x="40" y="-40" width="8" height="80" fill="#78350f" />
    <ellipse cx="44" cy="-35" rx="22" ry="16" fill="#fbbf24" stroke="#f59e0b" stroke-width="3" />
    <text x="44" y="-30" font-family="monospace" font-size="12" font-weight="bold" fill="#78350f" text-anchor="middle">GOAL</text>
  </g>

  <!-- PARKOUR ATHLETE CHARACTER (Mid-Air Dynamic Leap!) -->
  <g transform="translate(370, 210) rotate(-14)">
    <!-- Athletic Rigidbody Character in Mid-Air Leap -->
    <!-- Head with Helmet -->
    <circle cx="10" cy="-28" r="9" fill="#facc15" stroke="#ca8a04" stroke-width="2" />
    <!-- Torso (Athletic Jersey #7) -->
    <polygon points="0,-18 18,-18 14,10 -4,10" fill="#7c3aed" stroke="#c084fc" stroke-width="1.5" />
    <text x="6" y="0" font-family="monospace" font-weight="900" font-size="10" fill="#ffffff" text-anchor="middle">7</text>
    <!-- Extended Arms for Balance -->
    <line x1="0" y1="-12" x2="-22" y2="-22" stroke="#facc15" stroke-width="4" stroke-linecap="round" />
    <line x1="16" y1="-12" x2="36" y2="-26" stroke="#facc15" stroke-width="4" stroke-linecap="round" />
    <!-- Jumping Running Legs -->
    <line x1="-2" y1="10" x2="-20" y2="28" stroke="#1e1b4b" stroke-width="5" stroke-linecap="round" />
    <line x1="-20" y1="28" x2="-30" y2="24" stroke="#ef4444" stroke-width="5" stroke-linecap="round" /> <!-- shoe -->
    <line x1="12" y1="10" x2="28" y2="24" stroke="#1e1b4b" stroke-width="5" stroke-linecap="round" />
    <line x1="28" y1="24" x2="38" y2="34" stroke="#ef4444" stroke-width="5" stroke-linecap="round" /> <!-- shoe -->
    <!-- Jump Speed Trail Lines -->
    <line x1="-40" y1="5" x2="-15" y2="5" stroke="#c084fc" stroke-width="2" stroke-dasharray="4,4" />
    <line x1="-45" y1="18" x2="-25" y2="18" stroke="#c084fc" stroke-width="2" stroke-dasharray="4,4" />
  </g>

  <!-- UNITY GAME HUD OVERLAY -->
  <g font-family="monospace" font-size="11" font-weight="bold">
    <!-- Top Left Timer -->
    <rect x="36" y="24" width="200" height="42" rx="6" fill="rgba(15, 23, 42, 0.9)" stroke="#34d399" stroke-width="1" />
    <text x="48" y="42" fill="#34d399">TIME: 00:48.24 [SPEEDRUN]</text>
    <text x="48" y="56" fill="#94a3b8" font-size="10">CHECKPOINT: 3/5 REACHED</text>

    <!-- Top Right Hazard Status -->
    <rect x="550" y="24" width="214" height="42" rx="6" fill="rgba(24, 10, 15, 0.9)" stroke="#ef4444" stroke-width="1" />
    <text x="562" y="42" fill="#facc15">GAUNTLET: THE ROLLING LOGS</text>
    <text x="562" y="56" fill="#ef4444">PHYSICS RIGIDBODY: ACTIVE</text>
  </g>
</svg>
