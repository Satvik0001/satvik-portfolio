<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Space Gradient -->
    <radialGradient id="spaceGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1138" />
      <stop offset="50%" stop-color="#0d071d" />
      <stop offset="100%" stop-color="#04020a" />
    </radialGradient>

    <!-- Planet Surface Gradient -->
    <radialGradient id="planetGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3b1d75" />
      <stop offset="45%" stop-color="#1f0f42" />
      <stop offset="85%" stop-color="#0f0724" />
      <stop offset="100%" stop-color="#050210" />
    </radialGradient>

    <!-- Atmospheric Glow -->
    <radialGradient id="atmoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="#7c3aed" stop-opacity="0" />
      <stop offset="96%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.9" />
    </radialGradient>

    <!-- Meteor Fire Gradient -->
    <linearGradient id="meteorFire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="90%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0" />
    </linearGradient>

    <!-- Rover Neon Trail -->
    <linearGradient id="neonDrift" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="1" />
    </linearGradient>
  </defs>

  <!-- Deep Cosmos Background -->
  <rect width="800" height="450" fill="url(#spaceGlow)" />

  <!-- Stars Field -->
  <g fill="#ffffff" opacity="0.65">
    <circle cx="65" cy="45" r="1.2" />
    <circle cx="120" cy="110" r="1.5" />
    <circle cx="210" cy="60" r="0.9" />
    <circle cx="340" cy="85" r="1.4" />
    <circle cx="480" cy="40" r="1.1" />
    <circle cx="620" cy="95" r="1.6" />
    <circle cx="730" cy="55" r="1.2" />
    <circle cx="760" cy="140" r="1.5" />
    <circle cx="90" cy="220" r="1.0" />
    <circle cx="160" cy="310" r="1.3" />
    <circle cx="690" cy="330" r="1.1" />
    <circle cx="740" cy="260" r="1.4" />
    <circle cx="580" cy="380" r="1.0" />
  </g>

  <!-- Distant Cosmic Nebula Cloud -->
  <ellipse cx="640" cy="130" rx="160" ry="80" fill="#7c3aed" opacity="0.18" />
  <ellipse cx="200" cy="80" rx="140" ry="70" fill="#0284c7" opacity="0.14" />

  <!-- THE SPHERICAL PLANET (Center Bottom) -->
  <!-- Outer Atmosphere Ring -->
  <circle cx="400" cy="490" r="330" fill="url(#atmoGlow)" />
  <!-- Solid Planet Body -->
  <circle cx="400" cy="490" r="320" fill="url(#planetGrad)" stroke="#6366f1" stroke-width="1.5" />

  <!-- Spherical Latitude & Longitude Coordinate Grid (Non-Euclidean Curvature) -->
  <g stroke="#4338ca" stroke-width="1" fill="none" opacity="0.4">
    <ellipse cx="400" cy="490" rx="318" ry="110" />
    <ellipse cx="400" cy="490" rx="318" ry="190" />
    <ellipse cx="400" cy="490" rx="318" ry="260" />
    <path d="M400,170 Q400,490 400,810" />
    <path d="M220,200 Q320,490 220,780" />
    <path d="M580,200 Q480,490 580,780" />
  </g>

  <!-- Surface Craters on Planet -->
  <g fill="#110729" stroke="#311957" stroke-width="1.5" opacity="0.7">
    <ellipse cx="320" cy="240" rx="22" ry="12" />
    <ellipse cx="490" cy="225" rx="30" ry="14" />
    <ellipse cx="410" cy="285" rx="18" ry="9" />
  </g>

  <!-- Active Meteor Impact Crater with Shockwave Ring -->
  <circle cx="530" cy="210" r="28" fill="none" stroke="#f97316" stroke-width="1.5" opacity="0.7" />
  <circle cx="530" cy="210" r="44" fill="none" stroke="#ef4444" stroke-width="1" opacity="0.4" />
  <circle cx="530" cy="210" r="8" fill="#fbbf24" />

  <!-- DRIFTING CAR / ROVER ON PLANET APEX -->
  <!-- Cyan Tyre Drift Smoke & Light Trails following curvature -->
  <path d="M290,196 Q330,188 385,182" fill="none" stroke="url(#neonDrift)" stroke-width="5" stroke-linecap="round" />
  <path d="M295,202 Q335,194 390,188" fill="none" stroke="url(#neonDrift)" stroke-width="3" stroke-linecap="round" opacity="0.6" />

  <!-- Rover Chassis (Angled on curved surface) -->
  <g transform="translate(385, 172) rotate(8)">
    <!-- Wheels -->
    <rect x="-24" y="8" width="12" height="6" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="14" y="10" width="12" height="6" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="-18" y="-6" width="10" height="5" rx="2" fill="#0f172a" />
    <rect x="16" y="-4" width="10" height="5" rx="2" fill="#0f172a" />

    <!-- Main Aerodynamic Body -->
    <polygon points="-26,8 24,10 20,-2 -18,-2" fill="#7c3aed" stroke="#c084fc" stroke-width="1.5" />
    <!-- Cockpit Canopy Glass -->
    <polygon points="-10,-1 12,-1 8,-7 -6,-7" fill="#38bdf8" opacity="0.9" />
    <!-- Rear Spoiler -->
    <rect x="-26" y="-8" width="6" height="2" fill="#a855f7" />
    <line x1="-24" y1="-8" x2="-24" y2="-2" stroke="#a855f7" stroke-width="1.5" />
    <!-- Headlight Beam onto curved ground -->
    <polygon points="24,8 110,-10 120,25" fill="#38bdf8" opacity="0.25" />
  </g>

  <!-- FALLING METEORS FROM ORBIT -->
  <!-- Meteor 1: Massive incoming threat -->
  <g transform="translate(580, 110) rotate(-42)">
    <!-- Fire Trail -->
    <polygon points="0,0 -25,-180 25,-180" fill="url(#meteorFire)" opacity="0.9" />
    <!-- Core Rock -->
    <polygon points="-14,0 0,16 16,2 10,-14 -10,-12" fill="#78350f" stroke="#f59e0b" stroke-width="2" />
    <circle cx="2" cy="2" r="10" fill="#facc15" filter="drop-shadow(0 0 10px #f97316)" />
  </g>

  <!-- Meteor 2: High altitude secondary meteor -->
  <g transform="translate(240, 70) rotate(-38)">
    <polygon points="0,0 -16,-120 16,-120" fill="url(#meteorFire)" opacity="0.8" />
    <polygon points="-9,0 0,10 10,2 6,-9 -6,-8" fill="#78350f" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="1" cy="1" r="6" fill="#facc15" />
  </g>

  <!-- Meteor 3: Distant streak -->
  <g transform="translate(690, 40) rotate(-50)">
    <polygon points="0,0 -8,-70 8,-70" fill="url(#meteorFire)" opacity="0.7" />
    <circle cx="0" cy="0" r="4" fill="#fbbf24" />
  </g>

  <!-- GAME HUD OVERLAY (Authentic Unity In-Game Interface) -->
  <g font-family="monospace" font-size="11" font-weight="bold">
    <!-- Top Left Status -->
    <rect x="24" y="20" width="190" height="42" rx="6" fill="rgba(10, 6, 22, 0.85)" stroke="#6366f1" stroke-width="1" />
    <text x="36" y="38" fill="#38bdf8">GRAVITY: 360° SPHERICAL</text>
    <text x="36" y="52" fill="#a855f7">SURFACE TRACTION: 98%</text>

    <!-- Top Right Danger Meter -->
    <rect x="580" y="20" width="196" height="42" rx="6" fill="rgba(20, 5, 10, 0.85)" stroke="#ef4444" stroke-width="1" />
    <text x="592" y="38" fill="#ef4444">⚠ METEOR STORM: ACTIVE</text>
    <text x="592" y="52" fill="#f59e0b">IMPACT ETA: 01.4s [EVADE]</text>

    <!-- Bottom Left Speedometer -->
    <rect x="24" y="380" width="170" height="46" rx="6" fill="rgba(10, 6, 22, 0.85)" stroke="#38bdf8" stroke-width="1" />
    <text x="36" y="400" fill="#94a3b8" font-size="10">ROVER VELOCITY</text>
    <text x="36" y="418" fill="#38bdf8" font-size="16" font-weight="900">182 KM/H</text>
  </g>
</svg>
